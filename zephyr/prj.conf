CONFIG_GPIO=y
CONFIG_SERIAL=y

# --- Logging (saida na UART; usa o mesmo esquema do projeto de threads) ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_PRINTK=y
# KL25Z tem so 16 kB de RAM: aumente o buffer se aparecerem mensagens perdidas
CONFIG_LOG_BUFFER_SIZE=1024
# Thread que despeja o log na UART (prioridade 1: acima das threads de saque, prio 5)
CONFIG_LOG_PROCESS_THREAD_PRIORITY=1
CONFIG_THREAD_NAME=y
